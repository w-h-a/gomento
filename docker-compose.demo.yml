services:
  jaeger:
    container_name: jaeger
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - '16686:16686'
      - '4318:4318'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16 
    container_name: gomento-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gomento
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d gomento"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: gomento-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: user
      MINIO_ROOT_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc
    restart: no
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 user password;
      /usr/bin/mc mb --ignore-existing myminio/gomento-assets;
      /usr/bin/mc anonymous set public myminio/gomento-assets;
      exit 0;
      "
    
  gomento:
    container_name: gomento
    build: .
    ports:
      - "4000:4000"
      - "4001:4001"
    environment:
      PERSISTER_LOCATION: "postgres://user:password@postgres:5432/gomento?sslmode=disable"
      FILER_ENDPOINT: "http://minio:9000"
    depends_on:
      jaeger:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy